name: Publicar Palo Alto

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar simulador
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carregar site compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
